name: Build Quiz Tutor AI iOS tweak

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content.js"
      - "ios-tweak/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare and harden the original extension script
        shell: bash
        run: |
          set -euo pipefail
          python3 ios-tweak/scripts/prepare_content.py
          python3 ios-tweak/scripts/apply_stability_patch.py
          python3 ios-tweak/scripts/patch_native_router.py
          python3 -m py_compile ios-tweak/scripts/prepare_content.py
          python3 -m py_compile ios-tweak/scripts/apply_stability_patch.py
          python3 -m py_compile ios-tweak/scripts/patch_native_router.py
          python3 -m py_compile ios-tweak/tests/test_patch_scripts.py
          python3 ios-tweak/tests/test_patch_scripts.py
          node --check ios-tweak/scripts/scan_pipeline_core.js
          node --check ios-tweak/Resources/quiz-tutor-shim.js
          node --check ios-tweak/Resources/content.js
          node ios-tweak/tests/scan_pipeline.test.js

      - name: Clone Theos and prepare SDK directories
        run: |
          git clone --recursive https://github.com/theos/theos "$GITHUB_WORKSPACE/theos"
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks" "$GITHUB_WORKSPACE/theos/toolchain"

      - name: Install Theos and iOS SDKs
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/theos
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        working-directory: ios-tweak
        run: make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Collect Debian package and standalone dylib
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p out
          packages=(ios-tweak/packages/*.deb)
          test "${#packages[@]}" -gt 0
          cp "${packages[0]}" out/
          extract_dir="$RUNNER_TEMP/qt-package"
          mkdir -p "$extract_dir"
          dpkg-deb -x "${packages[0]}" "$extract_dir"
          find "$extract_dir" -type f -name 'AzotaQuizTutor.dylib' -exec cp {} out/ \;
          test -f out/AzotaQuizTutor.dylib
          ls -lah out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuizTutorAI-iOS-rootless-v2.4
          path: out/*
          if-no-files-found: error
          retention-days: 14
